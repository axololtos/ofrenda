<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofrenda demo</title>
<style>
  body { background: #15100c; color: #ece2cc; font: 16px/1.5 Georgia, serif; max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  a { color: #f29634; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  p { color: #bfae8a; margin: 4px 0 16px; }
  pre { background: #0e0b08; border: 1px solid #33291d; padding: 14px; min-height: 340px; overflow: auto; white-space: pre-wrap; font: 14px/1.6 Consolas, ui-monospace, monospace; }
  .cmd { color: #f29634; }
  .dim { color: #7e705c; }
  button { font: inherit; background: none; color: inherit; border: 1px solid #5a4a34; padding: 6px 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f29634; }
</style>
</head>
<body>
<h1>Ofrenda</h1>
<p>A recording of a real run on a laptop: local Gemma through Ollama, a Temporal dev server, no internet calls. Code: <a href="https://github.com/axololtos/ofrenda">github.com/axololtos/ofrenda</a></p>
<pre id="t" aria-live="polite"></pre>
<button id="again">Replay</button>

<script>
const S = [
  ["cmd", '$ python ofrenda.py remember "Abuela" "She burned the first tortilla on purpose, for the house. She sang boleros while washing dishes, always the same one, Sabor a Mi. On Sundays she made caldo de res and nobody was allowed to start eating before she sat down."'],
  ["out", "Lit 4 candle(s) for Abuela.\n"],
  ["cmd", '$ python ofrenda.py ask "Abuela" "What did she do with the first tortilla?"'],
  ["out", "She burned the first tortilla on purpose for the house.\n"],
  ["cmd", '$ python ofrenda.py ask "Abuela" "What did she cook on Sundays?"'],
  ["out", "On Sundays, she made caldo de res.\n"],
  ["cmd", '$ python ofrenda.py ask "Abuela" "Where was she born?"'],
  ["out", "The ofrenda does not hold that memory yet. Would you like to add it?\n"],
  ["dim", "# her birthplace was never in the story, so the keeper says so instead of guessing\n"],
  ["cmd", "$ python ofrenda.py people"],
  ["out", "Abuela"],
];
const t = document.getElementById("t");
const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
let run = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

async function play() {
  const me = ++run;
  t.textContent = "";
  for (const [kind, text] of S) {
    const span = document.createElement("span");
    if (kind !== "out") span.className = kind;
    t.append(span);
    if (kind === "cmd" && !fast) {
      for (const ch of text) { if (me !== run) return; span.textContent += ch; await wait(12); }
      await wait(500);
    } else {
      span.textContent = text;
      if (!fast) await wait(kind === "out" ? 700 : 200);
    }
    span.textContent += "\n";
  }
}
document.getElementById("again").onclick = play;
play();
</script>
</body>
</html>
